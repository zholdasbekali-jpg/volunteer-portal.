{% extends "base.html" %}
{% block title %}{{ _(title) }}{% endblock %}
{% block content %}
<div class="error-panel">
  <img src="{{ static_url('images/logo.png') }}" alt="QAMQOR">
  <div class="code">{{ code }}</div>
  <h1 class="h3">{{ _(title) }}</h1>
  <p class="mb-4" style="color: rgba(244,239,224,.85)">{{ _(text) }}</p>
  <a class="btn btn-gold" href="{{ url_for('events.index') }}">{{ _('Басты бетке') }}</a>
</div>
{% endblock %}
