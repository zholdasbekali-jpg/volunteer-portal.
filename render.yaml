# Render.com үшін (Blueprint). SQLite файлы үшін тұрақты диск қажет (ақылы жоспар),
# әйтпесе деректер әр қайта іске қосқанда жоғалады: демо үшін жарайды.
services:
  - type: web
    name: volunteer-portal
    runtime: python
    buildCommand: pip install -r requirements-deploy.txt
    startCommand: gunicorn wsgi:app --bind 0.0.0.0:$PORT --workers 2
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: PUBLIC_URL
        sync: false
      - key: TRUST_PROXY
        value: "1"
      - key: SESSION_COOKIE_SECURE
        value: "1"
      # Қосымша уақытты datetime.now() арқылы алады; Render-де әдепкі UTC (Қазақстаннан 5 сағат кем).
      # Осыныз іс-шараға тіркелу, QR-белгілеу терезесі мен "өтті" мәртебесі қате уақытта ауысады.
      - key: TZ
        value: Asia/Almaty
